name: Release

# Publica el jar como release de GitHub al empujar un tag de version (v*).
# El jar publicado sale siempre del codigo exacto del tag: nada de builds a mano.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      # JDK 25, no 21: paper-api 26.3 viene en bytecode de Java 25 y javac 21 no puede
      # leerlo. La salida sigue siendo bytecode 21, asi que el servidor necesita Java 21+.
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        run: mvn -B -DskipTests package

      - name: Publicar la release con el jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Core/target/CustomMobs-*.jar \
            --title "CustomMobs $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
